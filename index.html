<title>Чужой телефон</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Раскладка: узкая шапка дела сверху, под ней сам найденный телефон. Ночной экран, одна яркая точка: цвет улики. */
:root {
  --ink: #0b0d11;          /* фон страницы, холодный почти-чёрный */
  --screen: #11141a;       /* экран телефона */
  --panel: #1a1f27;        /* карточки, пузыри */
  --line: #2a313c;         /* границы */
  --text: #e8ebf0;
  --dim: #8b94a3;
  --evidence: #ff6b4a;     /* единственный акцент: новая улика и пометки */
  --evidence-soft: rgba(255, 107, 74, .16);
  --f-display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--text); font: 400 15px/1.45 var(--f-body); overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
button:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--evidence); outline-offset: 2px; }
.mono { font-family: var(--f-mono); }

#root { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 10px 16px 14px; gap: 10px; }

/* шапка дела */
.case { width: min(100%, 390px); display: flex; flex-direction: column; gap: 8px; flex: none; }
.case-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-width: 0; }
.case-title { min-width: 0; }
.case-no { font: 500 10px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.case-name { font: 700 14px/1.25 var(--f-display); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.notebook-btn { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; font-weight: 500; font-size: 13px; }
.notebook-btn b { font: 500 11px/1 var(--f-mono); background: var(--evidence); color: #1a0c08; border-radius: 6px; padding: 3px 5px; }
.days { display: flex; align-items: center; gap: 6px; }
.days-label { font: 500 10px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); margin-right: 4px; white-space: nowrap; }
.day { flex: 1; height: 30px; border: 1px solid var(--line); border-radius: 8px; font: 500 12px/1 var(--f-mono); color: var(--dim); display: grid; place-items: center; }
.day[aria-pressed="true"] { background: var(--text); color: var(--ink); border-color: var(--text); }
.day.past { color: var(--text); }

/* телефон */
.phone { position: relative; width: min(100%, 390px); flex: 1; min-height: 0; max-height: 780px; background: var(--screen); border: 1px solid var(--line); border-radius: 34px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.status { flex: none; display: flex; justify-content: space-between; align-items: center; padding: 12px 22px 6px; font: 500 12px/1 var(--f-mono); color: var(--text); z-index: 3; }
.status .right { display: flex; gap: 10px; align-items: center; }
.batt { display: inline-flex; align-items: center; gap: 5px; color: var(--evidence); }
.batt i { width: 20px; height: 10px; border: 1.5px solid currentColor; border-radius: 3px; position: relative; display: block; }
.batt i::after { content: ""; position: absolute; left: 1px; top: 1px; bottom: 1px; width: 2px; background: currentColor; border-radius: 1px; }
.view { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.bar { flex: none; display: flex; justify-content: center; padding: 8px 0 10px; }
.bar button { width: 120px; height: 5px; border-radius: 3px; background: var(--dim); opacity: .6; }
.bar button:focus-visible { outline-offset: 6px; }

/* экран блокировки */
.lock { height: 100%; display: flex; flex-direction: column; align-items: center; padding: 56px 28px 24px; text-align: center; background: radial-gradient(120% 70% at 50% 0%, #1d2330 0%, var(--screen) 70%); }
.lock-date { font: 500 13px/1 var(--f-mono); letter-spacing: .08em; color: var(--dim); text-transform: uppercase; }
.lock-time { font: 700 68px/1 var(--f-display); margin-top: 14px; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.lock-note { margin-top: 28px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: rgba(255,255,255,.03); text-align: left; max-width: 320px; font-size: 14px; }
.lock-note b { display: block; font: 500 10px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--evidence); margin-bottom: 8px; }
.lock-owner { margin-top: 12px; font: 500 12px/1.4 var(--f-mono); color: var(--dim); }
.unlock { margin-top: auto; width: 100%; max-width: 320px; padding: 15px; border-radius: 14px; background: var(--text); color: var(--ink); font-weight: 600; text-align: center; }
.unlock-hint { margin-top: 10px; font: 400 11px/1.3 var(--f-mono); color: var(--dim); }

/* домашний экран */
.home { height: 100%; display: flex; flex-direction: column; padding: 18px 22px 16px; background: linear-gradient(180deg, #1a2030 0%, var(--screen) 60%); }
.home-hello { font: 500 12px/1.3 var(--f-mono); color: var(--dim); }
.home-hello b { display: block; font: 700 22px/1.2 var(--f-display); color: var(--text); margin-top: 6px; }
.grid { margin-top: 28px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px 8px; }
.app { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 11.5px; position: relative; min-width: 0; }
.app .ic { width: 58px; height: 58px; border-radius: 16px; display: grid; place-items: center; position: relative; }
.app svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app .badge { position: absolute; top: -6px; right: -6px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--evidence); color: #1a0c08; font: 500 11px/20px var(--f-mono); text-align: center; border: 2px solid var(--screen); }
.dock-note { margin-top: auto; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 14px; color: var(--dim); font-size: 12.5px; }

/* шапка приложения */
.apphead { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 10px; padding: 8px 16px 10px; background: var(--screen); border-bottom: 1px solid var(--line); min-height: 48px; }
.back { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); }
.back svg { width: 16px; height: 16px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.apphead h2 { margin: 0; font: 700 16px/1.2 var(--f-display); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.apphead small { margin-left: auto; flex: none; font: 500 10px/1 var(--f-mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
.pad { padding: 14px 16px 24px; }
.later { margin: 18px 16px 0; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; color: var(--dim); font: 400 12px/1.4 var(--f-mono); }

.pad .later { margin-left: 0; margin-right: 0; }

/* сообщения */
.thread { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.thread li button { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.av { flex: none; width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font: 700 15px/1 var(--f-display); color: #0c0e12; }
.thread .meta { min-width: 0; flex: 1; }
.thread .nm { font-weight: 600; display: flex; justify-content: space-between; gap: 8px; }
.thread .nm span { font: 400 11px/1.6 var(--f-mono); color: var(--dim); flex: none; }
.thread .pv { color: var(--dim); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.msgs { display: flex; flex-direction: column; gap: 6px; padding: 14px 14px 24px; }
.msg { max-width: 82%; padding: 9px 12px 7px; border-radius: 16px; background: var(--panel); border: 1px solid transparent; text-align: left; position: relative; }
.msg.me { align-self: flex-end; background: #243049; border-bottom-right-radius: 5px; }
.msg.them { align-self: flex-start; border-bottom-left-radius: 5px; }
.msg time { display: block; margin-top: 3px; font: 400 10px/1 var(--f-mono); color: var(--dim); text-align: right; }
.msg.deleted { background: transparent; border: 1px dashed var(--line); color: var(--dim); font-style: italic; }
.msg.is-new { border-color: var(--evidence-soft); }
.msg.starred { border-color: var(--evidence); box-shadow: 0 0 0 3px var(--evidence-soft); }
.msg .flag { position: absolute; top: -7px; right: 8px; font: 500 9px/1 var(--f-mono); letter-spacing: .08em; background: var(--evidence); color: #1a0c08; border-radius: 5px; padding: 3px 5px; }
.tip { margin: 6px 14px 0; font: 400 11px/1.4 var(--f-mono); color: var(--dim); }

/* галерея */
.gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 14px 16px 24px; }
.ph { border-radius: 14px; overflow: hidden; border: 1px solid var(--line); text-align: left; display: flex; flex-direction: column; background: var(--panel); position: relative; }
.ph .pic { aspect-ratio: 1; display: grid; place-items: end start; padding: 10px; font: 500 10px/1 var(--f-mono); letter-spacing: .06em; color: rgba(255,255,255,.85); }
.ph .cap { padding: 8px 10px 10px; font-size: 12.5px; font-weight: 500; }
.ph.starred { border-color: var(--evidence); box-shadow: 0 0 0 3px var(--evidence-soft); }
.ph .flag, .card .flag { position: absolute; top: 8px; right: 8px; font: 500 9px/1 var(--f-mono); letter-spacing: .08em; background: var(--evidence); color: #1a0c08; border-radius: 5px; padding: 3px 5px; }
.viewer { position: absolute; inset: 0; z-index: 4; background: var(--screen); display: flex; flex-direction: column; }
.viewer .big { flex: none; aspect-ratio: 1; margin: 0 16px; border-radius: 16px; display: grid; place-items: end start; padding: 14px; font: 500 11px/1.4 var(--f-mono); color: rgba(255,255,255,.85); }
.viewer .info { padding: 14px 16px; overflow-y: auto; }
.viewer .info h3 { margin: 0 0 4px; font: 700 15px/1.3 var(--f-display); }
.exif { font: 400 12px/1.5 var(--f-mono); color: var(--dim); margin-bottom: 10px; }
.actions { display: flex; gap: 8px; margin-top: 12px; }
.btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); font-weight: 500; font-size: 13.5px; }
.btn.on { background: var(--evidence); border-color: var(--evidence); color: #1a0c08; }
.btn.solid { background: var(--text); color: var(--ink); border-color: var(--text); }

/* заметки и поиск */
.card { position: relative; padding: 12px 14px; border: 1px solid var(--line); background: var(--panel); border-radius: 14px; text-align: left; width: 100%; display: block; }
.card + .card { margin-top: 10px; }
.card h3 { margin: 0 0 4px; font-size: 14.5px; font-weight: 600; padding-right: 48px; }
.card p { margin: 0; white-space: pre-line; font-size: 14px; color: #cfd5de; }
.card time { display: block; margin-top: 8px; font: 400 11px/1 var(--f-mono); color: var(--dim); }
.card.starred { border-color: var(--evidence); box-shadow: 0 0 0 3px var(--evidence-soft); }
.search { display: flex; gap: 12px; align-items: baseline; }
.search time { margin: 0; flex: none; width: 44px; }
.search p { color: var(--text); }

/* блокнот детектива */
.sheet { position: absolute; inset: 0; z-index: 6; background: #0d1015; display: flex; flex-direction: column; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-top { flex: none; padding: 16px 16px 0; }
.sheet-top .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.sheet-top h2 { margin: 0; font: 700 16px/1.2 var(--f-display); }
.tabs { display: flex; gap: 4px; margin-top: 14px; border-bottom: 1px solid var(--line); }
.tab { padding: 9px 10px; font-size: 13.5px; font-weight: 500; color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--evidence); }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 16px 24px; }
.empty { color: var(--dim); font-size: 13.5px; padding: 8px 0; }
.ev { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.ev .src { flex: none; width: 74px; font: 500 10px/1.5 var(--f-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--evidence); }
.ev .tx { min-width: 0; font-size: 14px; overflow-wrap: anywhere; }
.sus { padding: 14px; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
.sus + .sus { margin-top: 10px; }
.sus.picked { border-color: var(--evidence); box-shadow: 0 0 0 3px var(--evidence-soft); }
.sus h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 10px; }
.sus h3 span { font: 400 11px/1.6 var(--f-mono); color: var(--dim); }
.sus p { margin: 6px 0 0; color: #cfd5de; font-size: 13.5px; }
.vote-note { margin-top: 14px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; font: 400 12px/1.45 var(--f-mono); color: var(--dim); }
.cm { padding: 10px 0; border-bottom: 1px solid var(--line); }
.cm b { font: 500 12px/1 var(--f-mono); color: var(--evidence); }
.cm p { margin: 4px 0 0; font-size: 14px; }
.cm.mine b { color: var(--text); }
.cm-form { display: flex; gap: 8px; margin-top: 14px; }
.cm-form input { flex: 1; min-width: 0; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
.cm-form input::placeholder { color: var(--dim); }
.cm-form input:focus-visible { outline: 2px solid var(--evidence); outline-offset: 1px; }
.hide-day { margin-top: 6px; font: 400 11px/1.45 var(--f-mono); color: var(--dim); }

@media (max-width: 480px) {
  #root { padding: 8px 0 0; gap: 8px; }
  .case { padding: 0 16px; }
  .phone { width: 100%; max-height: none; border-radius: 22px 22px 0 0; border-bottom: 0; box-shadow: none; }
}
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
</style>

<div id="root"></div>
<script src="case.js"></script>
<script>
(function () {
  var C = window.CASE;
  var S = { day: 1, screen: "lock", app: null, chat: null, photo: null, sheet: false, tab: "ev", starred: {}, vote: null, mine: [], tipShown: false };
  var KEY = "chuzhoy-telefon-001";

  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (saved.starred) S.starred = saved.starred;
    if (saved.vote) S.vote = saved.vote;
    if (saved.mine) S.mine = saved.mine;
    if (saved.day) S.day = saved.day;
  } catch (e) {}
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify({ starred: S.starred, vote: S.vote, mine: S.mine, day: S.day })); } catch (e) {}
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function $(sel, el) { return (el || document).querySelector(sel); }
  var root = document.getElementById("root");

  var ICONS = {
    chat: '<path d="M4 5h16v11H9l-5 4z"/>',
    photo: '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M21 16l-5-5-8 8"/>',
    note: '<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',
    web: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>'
  };
  var APPS = [
    { id: "chat", name: "Сообщения", color: "#3b6fe0" },
    { id: "photo", name: "Фото", color: "#d0527a" },
    { id: "note", name: "Заметки", color: "#c99a2e" },
    { id: "web", name: "Браузер", color: "#2f9c86" }
  ];

  function allEvidence() {
    var out = [];
    C.chats.forEach(function (ch) { ch.msgs.forEach(function (m, i) { if (m.day <= S.day && !m.deleted) out.push({ id: "m:" + ch.id + ":" + i, day: m.day, src: "Чат · " + ch.name, text: m.text }); }); });
    C.photos.forEach(function (p, i) { if (p.day <= S.day) out.push({ id: "p:" + i, day: p.day, src: "Фото", text: p.title + ". " + p.desc }); });
    C.notes.forEach(function (n, i) { if (n.day <= S.day) out.push({ id: "n:" + i, day: n.day, src: "Заметка", text: n.title + ": " + n.text.replace(/\n/g, "; ") }); });
    C.searches.forEach(function (q, i) { if (q.day <= S.day) out.push({ id: "s:" + i, day: q.day, src: "Поиск", text: q.q }); });
    return out;
  }
  function starCount() { return Object.keys(S.starred).filter(function (k) { return S.starred[k]; }).length; }
  function newCount(app) {
    var n = 0;
    if (app === "chat") C.chats.forEach(function (c) { c.msgs.forEach(function (m) { if (m.day === S.day) n++; }); });
    if (app === "photo") C.photos.forEach(function (p) { if (p.day === S.day) n++; });
    if (app === "note") C.notes.forEach(function (p) { if (p.day === S.day) n++; });
    if (app === "web") C.searches.forEach(function (p) { if (p.day === S.day) n++; });
    return n;
  }
  function toggle(id) { S.starred[id] = !S.starred[id]; persist(); }
  function laterLine() {
    return S.day < C.days
      ? '<div class="later">Это всё, что открыто на сегодня. Следующая порция улик появится завтра в 09:00.</div>'
      : '<div class="later">Все улики открыты. Откройте блокнот и проголосуйте.</div>';
  }

  /* --- экраны --- */
  function status() {
    return '<div class="status"><span>' + C.owner.frozen + '</span><span class="right"><span>нет сети</span><span class="batt"><i></i>' + C.owner.battery + '%</span></span></div>';
  }
  function lockView() {
    return '<div class="lock"><div class="lock-date">' + esc(C.owner.date) + '</div><div class="lock-time">' + C.owner.frozen + '</div>' +
      '<div class="lock-note"><b>Дело №' + C.id + '</b>' + esc(C.brief) + '</div>' +
      '<div class="lock-owner">Владелица: ' + esc(C.owner.name) + '</div>' +
      '<button class="unlock" data-act="unlock">Разблокировать</button><div class="unlock-hint">Телефон не защищён паролем. Всё, что внутри, теперь ваше.</div></div>';
  }
  function homeView() {
    var icons = APPS.map(function (a) {
      var n = newCount(a.id);
      return '<button class="app" data-act="open" data-app="' + a.id + '"><span class="ic" style="background:' + a.color + '"><svg viewBox="0 0 24 24">' + ICONS[a.id] + '</svg>' + (n ? '<span class="badge">' + n + '</span>' : '') + '</span>' + a.name + '</button>';
    }).join("");
    return '<div class="home"><div class="home-hello">День ' + S.day + ' из ' + C.days + '<b>Телефон ' + esc(C.owner.gen) + '</b></div><div class="grid">' + icons + '</div>' +
      '<div class="dock-note">Красные значки показывают новые улики за сегодня. Нашли что-то важное, отметьте: пометки попадут в блокнот.</div></div>';
  }
  function head(title, right) {
    return '<div class="apphead"><button class="back" data-act="back" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h2>' + esc(title) + '</h2>' + (right ? '<small>' + right + '</small>' : '') + '</div>';
  }
  function chatsView() {
    if (S.chat) {
      var ch = C.chats.filter(function (c) { return c.id === S.chat; })[0];
      var html = head(ch.name, "день " + S.day) + '<div class="msgs">';
      ch.msgs.forEach(function (m, i) {
        if (m.day > S.day) return;
        var id = "m:" + ch.id + ":" + i, st = S.starred[id];
        var cls = "msg " + m.from + (m.deleted ? " deleted" : "") + (m.day === S.day ? " is-new" : "") + (st ? " starred" : "");
        html += '<button class="' + cls + '" data-act="star" data-id="' + id + '"' + (m.deleted ? ' disabled' : '') + '>' + (st ? '<span class="flag">УЛИКА</span>' : '') + esc(m.text) + '<time>' + m.t + '</time></button>';
      });
      html += '</div><div class="tip">Нажмите на сообщение, чтобы пометить его уликой.</div>';
      return html + laterLine();
    }
    var list = C.chats.filter(function (c) { return c.msgs.some(function (m) { return m.day <= S.day; }); }).map(function (c) {
      var vis = c.msgs.filter(function (m) { return m.day <= S.day; }), last = vis[vis.length - 1];
      return '<li><button data-act="chat" data-id="' + c.id + '"><span class="av" style="background:' + c.color + '">' + esc(c.name[0]) + '</span><span class="meta"><span class="nm">' + esc(c.name) + '<span>' + last.t + '</span></span><span class="pv" style="display:block">' + esc(last.text) + '</span></span></button></li>';
    }).join("");
    return head("Сообщения") + '<ul class="thread">' + list + '</ul><div class="pad">' + laterLine().replace('class="later"', 'class="later" style="margin-top:0"') + '</div>';
  }
  function photosView() {
    if (S.photo !== null) {
      var p = C.photos[S.photo], id = "p:" + S.photo, st = S.starred[id];
      return '<div class="viewer">' + head(p.title) +
        '<div class="big" style="background:linear-gradient(145deg,' + p.tones[0] + ',' + p.tones[1] + ')">' + esc(p.time) + ' · ' + esc(p.place) + '</div>' +
        '<div class="info"><div class="exif">Снято: ' + esc(p.time) + '<br>Место: ' + esc(p.place) + '</div><p style="margin:0">' + esc(p.desc) + '</p>' +
        '<div class="actions"><button class="btn' + (st ? ' on' : '') + '" data-act="star" data-id="' + id + '">' + (st ? 'Улика отмечена' : 'Отметить уликой') + '</button></div></div></div>';
    }
    var tiles = C.photos.map(function (p, i) {
      if (p.day > S.day) return "";
      var st = S.starred["p:" + i];
      return '<button class="ph' + (st ? ' starred' : '') + '" data-act="photo" data-i="' + i + '">' + (p.day === S.day ? '<span class="flag">НОВОЕ</span>' : '') + '<span class="pic" style="background:linear-gradient(145deg,' + p.tones[0] + ',' + p.tones[1] + ')">' + esc(p.time) + '</span><span class="cap">' + esc(p.title) + '</span></button>';
    }).join("");
    return head("Фото", C.photos.filter(function (p) { return p.day <= S.day; }).length + " шт.") + '<div class="gallery">' + tiles + '</div><div class="pad" style="padding-top:0">' + laterLine().replace('class="later"', 'class="later" style="margin-top:0"') + '</div>';
  }
  function notesView() {
    var cards = C.notes.map(function (n, i) {
      if (n.day > S.day) return "";
      var id = "n:" + i, st = S.starred[id];
      return '<button class="card' + (st ? ' starred' : '') + '" data-act="star" data-id="' + id + '">' + (n.day === S.day ? '<span class="flag">НОВОЕ</span>' : '') + '<h3>' + esc(n.title) + '</h3><p>' + esc(n.text) + '</p><time>' + esc(n.time) + '</time></button>';
    }).join("");
    return head("Заметки") + '<div class="pad">' + cards + laterLine() + '</div>';
  }
  function webView() {
    var cards = C.searches.map(function (q, i) {
      if (q.day > S.day) return "";
      var id = "s:" + i, st = S.starred[id];
      return '<button class="card search' + (st ? ' starred' : '') + '" data-act="star" data-id="' + id + '"><time>' + q.time + '</time><p>' + esc(q.q) + '</p>' + (q.day === S.day ? '<span class="flag">НОВОЕ</span>' : '') + '</button>';
    }).join("");
    return head("История поиска") + '<div class="pad">' + cards + laterLine() + '</div>';
  }

  /* --- блокнот --- */
  function sheetView() {
    var tabs = [["ev", "Улики"], ["sus", "Подозреваемые"], ["cm", "Обсуждение"]].map(function (t) {
      return '<button class="tab" role="tab" aria-selected="' + (S.tab === t[0]) + '" data-act="tab" data-tab="' + t[0] + '">' + t[1] + '</button>';
    }).join("");
    var body = "";
    if (S.tab === "ev") {
      var ev = allEvidence().filter(function (e) { return S.starred[e.id]; });
      body = ev.length ? ev.map(function (e) { return '<div class="ev"><span class="src">' + esc(e.src) + '<br>день ' + e.day + '</span><span class="tx">' + esc(e.text) + '</span></div>'; }).join("")
        : '<div class="empty">Пока пусто. Откройте приложения на телефоне и отметьте всё, что кажется странным.</div>';
    }
    if (S.tab === "sus") {
      body = C.suspects.map(function (s) {
        var picked = S.vote === s.id;
        return '<div class="sus' + (picked ? ' picked' : '') + '"><h3>' + esc(s.name) + '<span>' + esc(s.role) + '</span></h3><p>' + esc(s.hint) + '</p>' +
          (S.day === C.days ? '<div class="actions"><button class="btn' + (picked ? ' on' : '') + '" data-act="vote" data-id="' + s.id + '">' + (picked ? 'Ваш голос' : 'Это он(а)') + '</button></div>' : '') + '</div>';
      }).join("") + '<div class="vote-note">' + (S.day === C.days ? 'Голосование открыто. Голос можно поменять до конца сезона.' : 'Голосование откроется на ' + C.days + '-й день. Пока можно собирать улики и строить версии.') + '</div>';
    }
    if (S.tab === "cm") {
      var all = C.comments.filter(function (c) { return c.day <= S.day; }).concat(S.mine.filter(function (c) { return c.day <= S.day; }));
      all.sort(function (a, b) { return a.day - b.day; });
      body = (all.length ? all.map(function (c) { return '<div class="cm' + (c.mine ? ' mine' : '') + '"><b>' + esc(c.user) + ' · день ' + c.day + '</b><p>' + esc(c.text) + '</p></div>'; }).join("") : '<div class="empty">Пока никто не написал.</div>') +
        '<form class="cm-form" data-form="cm"><input id="cm-input" type="text" maxlength="240" placeholder="Ваша версия на день ' + S.day + '" autocomplete="off"><button class="btn solid" type="submit">Отправить</button></form>' +
        '<div class="hide-day">Вы видите только комментарии до дня ' + S.day + '. Спойлеры из будущих дней скрыты. Комментарии в прототипе локальные, это примеры.</div>';
    }
    return '<div class="sheet"><div class="sheet-top"><div class="row"><h2>Блокнот детектива</h2><button class="btn" data-act="close-sheet">Закрыть</button></div><div class="tabs" role="tablist">' + tabs + '</div></div><div class="sheet-body">' + body + '</div></div>';
  }

  /* --- сборка --- */
  function view() {
    if (S.screen === "lock") return lockView();
    if (S.screen === "home") return homeView();
    if (S.app === "chat") return chatsView();
    if (S.app === "photo") return photosView();
    if (S.app === "note") return notesView();
    return webView();
  }
  function render() {
    var scrollTop = 0, v = $(".view");
    if (v) scrollTop = v.scrollTop;
    var pips = "";
    for (var d = 1; d <= C.days; d++) pips += '<button class="day' + (d < S.day ? ' past' : '') + '" aria-pressed="' + (d === S.day) + '" data-act="day" data-d="' + d + '" aria-label="День ' + d + '">' + d + '</button>';
    root.innerHTML =
      '<header class="case"><div class="case-row"><div class="case-title"><div class="case-no">Дело №' + C.id + '</div><div class="case-name">' + esc(C.title) + '</div></div>' +
      '<button class="notebook-btn" data-act="open-sheet">Блокнот' + (starCount() ? ' <b>' + starCount() + '</b>' : '') + '</button></div>' +
      '<div class="days"><span class="days-label">Демо: день</span>' + pips + '</div></header>' +
      '<main class="phone">' + status() + '<div class="view" id="view">' + view() + '</div><div class="bar"><button data-act="home" aria-label="На главный экран"></button></div>' + (S.sheet ? sheetView() : '') + '</main>';
    var nv = $(".view"); if (nv && !S.chat && S.screen === "app") nv.scrollTop = scrollTop;
    if (S.sheet && S.tab === "cm") { var inp = $("#cm-input"); if (inp && S.focusCm) { inp.focus(); S.focusCm = false; } }
  }

  /* --- события --- */
  root.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]"); if (!t) return;
    var a = t.getAttribute("data-act");
    if (a === "unlock") { S.screen = "home"; }
    else if (a === "open") { S.screen = "app"; S.app = t.getAttribute("data-app"); S.chat = null; S.photo = null; }
    else if (a === "home") { if (S.screen !== "lock") { S.screen = "home"; S.app = null; S.chat = null; S.photo = null; } }
    else if (a === "back") { if (S.photo !== null) S.photo = null; else if (S.chat) S.chat = null; else { S.screen = "home"; S.app = null; } }
    else if (a === "chat") { S.chat = t.getAttribute("data-id"); }
    else if (a === "photo") { S.photo = +t.getAttribute("data-i"); }
    else if (a === "star") { toggle(t.getAttribute("data-id")); }
    else if (a === "day") { S.day = +t.getAttribute("data-d"); persist(); }
    else if (a === "open-sheet") { S.sheet = true; }
    else if (a === "close-sheet") { S.sheet = false; }
    else if (a === "tab") { S.tab = t.getAttribute("data-tab"); }
    else if (a === "vote") { S.vote = t.getAttribute("data-id"); persist(); }
    render();
  });
  root.addEventListener("submit", function (e) {
    if (e.target.getAttribute("data-form") !== "cm") return;
    e.preventDefault();
    var inp = $("#cm-input"), v = inp && inp.value.trim(); if (!v) return;
    S.mine.push({ day: S.day, user: "вы", text: v, mine: true }); persist(); S.focusCm = true; render();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && S.sheet) { S.sheet = false; render(); } });

  render();
})();
</script>
